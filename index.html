<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="theme-color" content="#4f46e5">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oltacı Dedektifi</title>
<link rel="icon" type="image/png" href="favicon.png"><!-- 🕵️ ikon: Twemoji (CC-BY 4.0, https://github.com/jdecked/twemoji) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;font-size:18px;color:#1e1b4b;min-height:100vh;
background:radial-gradient(circle at 15% 10%,#fde68a 0 12%,transparent 13%),radial-gradient(circle at 90% 25%,#fbcfe8 0 10%,transparent 11%),radial-gradient(circle at 80% 90%,#a7f3d0 0 14%,transparent 15%),linear-gradient(160deg,#c7d2fe,#e0f2fe 60%,#fef3c7);background-attachment:fixed}
main{max-width:600px;margin:0 auto;padding:18px 14px 40px;animation:pop .4s}
h1{font-size:2.2rem;margin:.2em 0;color:#4338ca;text-shadow:0 3px 0 #fff}h2{margin:.2em 0}
.hero{text-align:center}.big{font-size:5.5rem;animation:bounce 1.4s infinite}
.hero p{font-size:1.15rem}small{color:#475569}
button{font:inherit;font-weight:700;font-size:1.2rem;color:#fff;width:100%;padding:16px;border:0;border-radius:18px;margin-top:12px;cursor:pointer;
background:#6366f1;box-shadow:0 6px 0 #4338ca;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #4338ca}
button.bad{background:#ef4444;box-shadow:0 6px 0 #b91c1c}button.good{background:#22c55e;box-shadow:0 6px 0 #15803d}
button.bad:active{box-shadow:0 1px 0 #b91c1c}button.good:active{box-shadow:0 1px 0 #15803d}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stars{text-align:center;font-size:1.3rem;letter-spacing:3px;background:#ffffffb0;border-radius:99px;padding:6px;margin-bottom:10px}
.inbox{background:#fff;border-radius:22px;border:4px solid #fff;box-shadow:0 10px 0 #a5b4fc,0 14px 24px #0003;overflow:hidden;margin:12px 0 18px;animation:slide .35s}
.top{background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;padding:10px 16px;font-weight:700;display:flex;justify-content:space-between}
.mailbody{padding:16px}.mailbody h3{margin:0 0 12px;font-size:1.3rem}
.who{display:flex;gap:12px;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:2px dashed #e0e7ff}
.av{width:48px;height:48px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center;font-size:1.4rem;flex:none;box-shadow:0 3px 0 #0003}
.who small{display:block;word-break:break-all;font-size:.8rem}
.fakebtn{display:inline-block;background:#2563eb;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;box-shadow:0 4px 0 #1d4ed8}
.res+button{margin-top:26px}
.res{padding:14px 16px;border-radius:20px;margin:6px 0;border:3px solid #fff;animation:pop .35s}.res.y{background:#bbf7d0}.res.n{background:#fecaca}
.real{font-size:.85rem;word-break:break-all}
.tip{background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0 0}
article{background:#fff;border-radius:20px;padding:14px;text-align:left;line-height:1.8;box-shadow:0 5px 0 #c7d2fe;margin:12px 0}
.conf{position:fixed;top:-20px;font-size:1.6rem;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
@keyframes bounce{50%{transform:translateY(-14px) rotate(-6deg)}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@keyframes slide{from{transform:translateY(24px);opacity:0}}
</style></head><body><main id="app"></main>
<script src="app.js"></script></body></html>
